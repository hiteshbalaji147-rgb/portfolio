<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0a0b"/>
      <stop offset="50%" stop-color="#140f11"/>
      <stop offset="100%" stop-color="#1a1114"/>
    </linearGradient>
    <linearGradient id="glowRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4151" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#70121c" stop-opacity="0.2"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg1)"/>
  <!-- Grid overlay -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="50" x2="800" y2="50"/>
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="250" x2="800" y2="250"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="350" x2="800" y2="350"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="0" y1="450" x2="800" y2="450"/>
    <line x1="100" y1="0" x2="100" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="300" y1="0" x2="300" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="500" y1="0" x2="500" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
    <line x1="700" y1="0" x2="700" y2="500"/>
  </g>
  <!-- Window Frame -->
  <rect x="40" y="40" width="720" height="420" rx="6" fill="#110d0e" stroke="#2d1c20" stroke-width="1.5"/>
  <!-- Title bar -->
  <rect x="40" y="40" width="720" height="38" rx="6" fill="#181214"/>
  <circle cx="65" cy="59" r="5" fill="#ef4151"/>
  <circle cx="82" cy="59" r="5" fill="#f59e0b"/>
  <circle cx="99" cy="59" r="5" fill="#10b981"/>
  <text x="400" y="63" fill="#a09c9a" font-family="monospace" font-size="11" text-anchor="middle">nexus-studio-os // gpu-canvas v3.4</text>
  <!-- Canvas workspace -->
  <rect x="60" y="95" width="480" height="260" rx="4" fill="#090808" stroke="#ef4151" stroke-opacity="0.2"/>
  <!-- Vector Nodes -->
  <path d="M120 220 C200 120, 280 320, 380 180 S460 260, 500 200" fill="none" stroke="url(#glowRed)" stroke-width="3"/>
  <circle cx="120" cy="220" r="6" fill="#ef4151"/>
  <circle cx="240" cy="220" r="5" fill="#ffffff"/>
  <circle cx="380" cy="180" r="6" fill="#ef4151"/>
  <circle cx="500" cy="200" r="6" fill="#ffffff"/>
  <!-- Multi-user Cursors -->
  <polygon points="260,140 270,165 264,163 260,172 256,163" fill="#3b82f6"/>
  <rect x="272" y="155" width="45" height="18" rx="3" fill="#3b82f6"/>
  <text x="294" y="167" fill="#fff" font-family="sans-serif" font-size="9" text-anchor="middle">Ada</text>
  <polygon points="420,240 430,265 424,263 420,272 416,263" fill="#ef4151"/>
  <rect x="432" y="255" width="50" height="18" rx="3" fill="#ef4151"/>
  <text x="457" y="267" fill="#fff" font-family="sans-serif" font-size="9" text-anchor="middle">Linus</text>
  <!-- Sidebar Inspector -->
  <rect x="560" y="95" width="180" height="345" rx="4" fill="#151012" stroke="#2d1c20"/>
  <text x="580" y="125" fill="#f2efeb" font-family="sans-serif" font-size="11" font-weight="bold">INSPECTOR</text>
  <rect x="580" y="145" width="140" height="14" rx="2" fill="#24191c"/>
  <rect x="580" y="170" width="90" height="14" rx="2" fill="#24191c"/>
  <rect x="580" y="205" width="140" height="60" rx="3" fill="#0d0a0b" stroke="#3d2127"/>
  <text x="590" y="225" fill="#ef4151" font-family="monospace" font-size="10">FPS: 60.0</text>
  <text x="590" y="242" fill="#a09c9a" font-family="monospace" font-size="9">LATENCY: 12ms</text>
  <!-- Timeline at bottom -->
  <rect x="60" y="375" width="480" height="65" rx="4" fill="#151012" stroke="#2d1c20"/>
  <line x1="80" y1="405" x2="520" y2="405" stroke="#ef4151" stroke-width="2"/>
  <circle cx="210" cy="405" r="7" fill="#ef4151"/>
</svg>
