<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0c"/>
      <stop offset="100%" stop-color="#120c14"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg3)"/>
  <!-- Top navigation bar -->
  <rect x="0" y="0" width="800" height="50" fill="#140f16" stroke="#251628" stroke-width="1"/>
  <circle cx="35" cy="25" r="8" fill="#ef4151"/>
  <text x="55" y="29" fill="#f2efeb" font-family="sans-serif" font-size="13" font-weight="bold">PULSE // CLINICAL TELEMETRY</text>
  <text x="760" y="29" fill="#a09c9a" font-family="monospace" font-size="10" text-anchor="end">PATIENT ID: #ICU-0842</text>
  <!-- ECG Heartbeat Canvas -->
  <rect x="35" y="75" width="490" height="230" rx="6" fill="#0c070e" stroke="#2a142e"/>
  <text x="55" y="105" fill="#ef4151" font-family="monospace" font-size="11" font-weight="bold">LEAD II // REALTIME ECG</text>
  <!-- ECG Line Path -->
  <path d="M50 200 L120 200 L135 195 L145 200 L155 185 L165 240 L180 80 L195 225 L205 195 L220 200 L300 200 L315 195 L325 200 L335 185 L345 240 L360 80 L375 225 L385 195 L400 200 L480 200" fill="none" stroke="#ef4151" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Vitals Stat Grid -->
  <rect x="545" y="75" width="220" height="385" rx="6" fill="#120c15" stroke="#2a142e"/>
  <!-- Heart Rate Card -->
  <rect x="560" y="95" width="190" height="75" rx="4" fill="#190e1d" stroke="#3c1a42"/>
  <text x="575" y="120" fill="#a09c9a" font-family="monospace" font-size="9">HEART RATE (BPM)</text>
  <text x="575" y="155" fill="#ef4151" font-family="sans-serif" font-size="34" font-weight="900">72</text>
  <text x="635" y="152" fill="#10b981" font-family="monospace" font-size="10">NORMAL</text>
  <!-- SpO2 Card -->
  <rect x="560" y="185" width="190" height="75" rx="4" fill="#190e1d" stroke="#3c1a42"/>
  <text x="575" y="210" fill="#a09c9a" font-family="monospace" font-size="9">OXYGEN SAT (SPO2)</text>
  <text x="575" y="245" fill="#3b82f6" font-family="sans-serif" font-size="34" font-weight="900">99%</text>
  <!-- Blood Pressure Card -->
  <rect x="560" y="275" width="190" height="75" rx="4" fill="#190e1d" stroke="#3c1a42"/>
  <text x="575" y="300" fill="#a09c9a" font-family="monospace" font-size="9">BLOOD PRESSURE (SYS/DIA)</text>
  <text x="575" y="335" fill="#f2efeb" font-family="sans-serif" font-size="30" font-weight="900">118/78</text>
  <!-- Bottom Waveform (Respiration) -->
  <rect x="35" y="325" width="490" height="135" rx="6" fill="#0c070e" stroke="#2a142e"/>
  <text x="55" y="355" fill="#3b82f6" font-family="monospace" font-size="11" font-weight="bold">RESPIRATION RATE // 16 RPM</text>
  <path d="M50 410 Q90 370 130 410 T210 410 T290 410 T370 410 T450 410" fill="none" stroke="#3b82f6" stroke-width="2"/>
</svg>
