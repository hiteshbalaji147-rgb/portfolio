<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0d"/>
      <stop offset="100%" stop-color="#111624"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg6)"/>
  <!-- Top bar -->
  <rect x="0" y="0" width="800" height="45" fill="#101522"/>
  <text x="35" y="28" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold">CHRONOS // NEURAL TASK & TIMELINE PLANNER</text>
  <text x="760" y="28" fill="#a09c9a" font-family="monospace" font-size="10" text-anchor="end">OFFLINE-FIRST SYNC: ACTIVE</text>
  <!-- Node Graph Layout -->
  <g stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.5">
    <line x1="140" y1="180" x2="300" y2="120"/>
    <line x1="140" y1="180" x2="300" y2="260"/>
    <line x1="300" y1="120" x2="480" y2="180"/>
    <line x1="300" y1="260" x2="480" y2="180"/>
    <line x1="480" y1="180" x2="640" y2="180"/>
  </g>
  <!-- Main Node 1 -->
  <circle cx="140" cy="180" r="32" fill="#17223b" stroke="#38bdf8" stroke-width="2"/>
  <text x="140" y="184" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">INPUT</text>
  <!-- Branch Node 2 -->
  <circle cx="300" cy="120" r="28" fill="#17223b" stroke="#ef4151" stroke-width="2"/>
  <text x="300" y="124" fill="#ef4151" font-family="monospace" font-size="9" text-anchor="middle">ANALYZE</text>
  <!-- Branch Node 3 -->
  <circle cx="300" cy="260" r="28" fill="#17223b" stroke="#10b981" stroke-width="2"/>
  <text x="300" y="264" fill="#10b981" font-family="monospace" font-size="9" text-anchor="middle">SCHEDULE</text>
  <!-- Converge Node 4 -->
  <circle cx="480" cy="180" r="36" fill="#17223b" stroke="#f59e0b" stroke-width="2"/>
  <text x="480" y="184" fill="#f59e0b" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">OPTIMIZE</text>
  <!-- Output Node 5 -->
  <circle cx="640" cy="180" r="32" fill="#17223b" stroke="#38bdf8" stroke-width="2"/>
  <text x="640" y="184" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">EXECUTE</text>
  <!-- Timeline cards at bottom -->
  <rect x="50" y="340" width="210" height="90" rx="4" fill="#121a2c" stroke="#253554"/>
  <text x="70" y="370" fill="#f2efeb" font-family="sans-serif" font-size="11" font-weight="bold">Core Architecture Refactor</text>
  <text x="70" y="390" fill="#a09c9a" font-family="monospace" font-size="9">EST: 2.5h // PRIORITY: HIGH</text>
  <rect x="70" y="405" width="170" height="6" rx="3" fill="#253554"/>
  <rect x="70" y="405" width="130" height="6" rx="3" fill="#ef4151"/>
  <rect x="295" y="340" width="210" height="90" rx="4" fill="#121a2c" stroke="#253554"/>
  <text x="315" y="370" fill="#f2efeb" font-family="sans-serif" font-size="11" font-weight="bold">WebGL Pipeline Tests</text>
  <text x="315" y="390" fill="#a09c9a" font-family="monospace" font-size="9">EST: 1.0h // PRIORITY: MEDIUM</text>
  <rect x="315" y="405" width="170" height="6" rx="3" fill="#253554"/>
  <rect x="315" y="405" width="90" height="6" rx="3" fill="#10b981"/>
  <rect x="540" y="340" width="210" height="90" rx="4" fill="#121a2c" stroke="#253554"/>
  <text x="560" y="370" fill="#f2efeb" font-family="sans-serif" font-size="11" font-weight="bold">Lighthouse Core Audit</text>
  <text x="560" y="390" fill="#a09c9a" font-family="monospace" font-size="9">EST: 45m // PRIORITY: DONE</text>
  <rect x="560" y="405" width="170" height="6" rx="3" fill="#253554"/>
  <rect x="560" y="405" width="170" height="6" rx="3" fill="#38bdf8"/>
</svg>
